# Daily: build nixStatic from the latest stable nixpkgs and compare it with the most recent release. A new version gets
# a draft release tagged VERSION_YYYYMMDD.1; the same version gets VERSION_YYYYMMDD.N (N counts up within a day) if the
# NAR hash of the packaged files changed, or always when run manually. Each release creates an issue assigned to the repo
# owner. Publish the draft to release.
name: Release
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          stable=$(git ls-remote --heads https://github.com/NixOS/nixpkgs 'nixos-*' \
            | grep -oE 'nixos-[0-9]{2}\.[0-9]{2}$' | sort -V | tail -1)
          nix build "github:NixOS/nixpkgs/${stable:?}#nixStatic^out,man"
      - id: package
        run: |
          version=$(result/bin/nix --version | awk '{ print $3 }')
          rsync -a --copy-unsafe-links result/ result-resolved/
          rsync -a --copy-unsafe-links result-man/ result-resolved/
          mkdir dist
          chmod -R u+w,go+rX,go-w result-resolved
          tar --owner=0 --group=0 --numeric-owner -czf "dist/nix-$version-$(uname -m)-linux.tar.gz" -C result-resolved .
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir hash
          hash=$(nix hash path result-resolved)
          echo "$(uname -m): $hash" > "hash/$(uname -m)"
      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ runner.arch }}
          path: hash/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          path: hash
          merge-multiple: true
      - run: |
          hashes=$(echo "NAR hashes:"; cat hash/*)
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          date=$(date -u +%Y%m%d)
          revision=1
          if [ "${previous%_*}" = "$VERSION" ]; then
            previous_hashes=$(gh release view "$previous" --repo "$GITHUB_REPOSITORY" --json body -q .body | tr -d '\r')
            if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$previous_hashes" = "$hashes" ]; then
              echo "$previous is up to date"
              exit 0
            fi
            if [ "${previous%.*}" = "${VERSION}_$date" ]; then
              revision=$((${previous##*.} + 1))
            fi
          fi
          tag=${VERSION}_$date.$revision
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "$tag" --notes ""
          # Record the hashes only after every asset uploaded, so an incomplete draft never counts as up to date
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$hashes"
          url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url -q .url)
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "Publish nix $tag" --body "Draft release is ready: $url"
